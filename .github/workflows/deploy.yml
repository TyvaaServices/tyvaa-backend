  dockerize:
    #    needs: [ test, quality ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USER }}/backend-tyvaa:latest .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USER }}/backend-tyvaa:latest

  #  Deployment is currently disabled. To enable, uncomment the section below.
  deploy:
    needs: [ dockerize ]
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: 1
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.0.0
      - name: Terraform Init
        working-directory: ./infra
        run: terraform init
        env:
          TF_IN_AUTOMATION: 1
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
      - name: Terraform Validate
        working-directory: ./infra
        run: terraform validate
      - name: Import existing Koyeb app and service
        working-directory: ./infra
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TF_IN_AUTOMATION: 1
        run: |
          # Import app
          if ! terraform state list koyeb_app.backend >/dev/null 2>&1; then
            APP_ID=$(curl -s -H "Authorization: Bearer $KOYEB_TOKEN" \
              "https://app.koyeb.com/v1/apps?name=backend-tyvaa" | jq -r '.apps[0].id')
            if [ "$APP_ID" != "null" ] && [ -n "$APP_ID" ]; then
              echo "Importing existing app $APP_ID..."
              terraform import -lock=false -var="database_url=$DATABASE_URL" koyeb_app.backend $APP_ID
            else
              echo "No existing app found, will create new one."
            fi
          fi

          # Import service
          if ! terraform state list koyeb_service.backend_service >/dev/null 2>&1; then
            SERVICE_ID=$(curl -s -H "Authorization: Bearer $KOYEB_TOKEN" \
              "https://app.koyeb.com/v1/services?name=backend-tyvaa-service" | jq -r '.services[0].id')
            if [ "$SERVICE_ID" != "null" ] && [ -n "$SERVICE_ID" ]; then
              echo "Importing existing service $SERVICE_ID..."
              terraform import -lock=false -var="database_url=$DATABASE_URL" koyeb_service.backend_service $SERVICE_ID
            else
              echo "No existing service found, will create new one."
            fi
          fi
      
      - name: Terraform Plan
        working-directory: ./infra
        run: terraform plan -var="database_url=${{ secrets.DATABASE_URL }}"
      - name: Terraform Apply
        working-directory: ./infra
        run: terraform apply -auto-approve -var="database_url=${{ secrets.DATABASE_URL }}" -var="docker_hub_user=${{ secrets.DOCKER_HUB_USER }}"